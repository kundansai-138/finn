# Local stack. Same Postgres engine and extensions as production (Neon runs Postgres 16 + pgvector).
#
#   docker compose up -d db                 # just the database; run the app on the host
#   docker compose --profile app up --build # database + app in containers
#
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: finn
      POSTGRES_USER: finn_admin
      POSTGRES_PASSWORD: ${FINN_DB_ADMIN_PASSWORD:-finn_admin_local}   # local-only default
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro   # creates the app role, extensions, test database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finn_admin -d finn"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://finn_app:${FINN_DB_APP_PASSWORD:-finn_app_local}@db:5432/finn
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FINN_SCHEDULER: "on"
    ports:
      - "8080:8000"   # 8080 on the host so it can run beside a dev server on 8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
